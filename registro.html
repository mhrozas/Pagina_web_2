<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Ch.Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="registration-container">
        
        <!-- LOGO CLICKABLE QUE REDIRIGE AL INICIO -->
        <div class="logo-registro">
            <a href="index.html">
                <img src="img/logo3.png" alt="Logo Ch.Store - Volver al inicio">
            </a>
        </div>

        <div class="form-box">
            <h2>Registro de usuario</h2>

            <form action="#" method="POST">
                
                <div class="form-group">
                    <label for="nombre">NOMBRE COMPLETO</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="form-group">
                    <label for="rut">RUT</label>
                    <input type="text" id="rut" name="rut" required>
                </div>

                <div class="form-group">
                    <label for="correo">CORREO</label>
                    <input type="email" id="correo" name="correo" required>
                </div>

                <div class="form-group">
                    <label for="password">CONTRASEÑA</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password">CONFIRMAR CONTRASEÑA</label>
                    <input type="password" id="confirm_password" name="confirm_password" required>
                </div>

                <div class="form-group">
                    <label for="telefono">TELÉFONO (opcional)</label>
                    <input type="tel" id="telefono" name="telefono">
                </div>
        
                <div class="form-row">
                    <div class="form-group half-width">
                        <select id="region" name="region">
                            <option value="">-- Seleccione la región --</option>
                            <option value="rm">Región Metropolitana de Santiago</option>
                            <option value="araucania">Región de la Araucanía</option>
                            <option value="nuble">Región de Ñuble</option>
                        </select>
                    </div>
                    <div class="form-group half-width">
                        <select id="comuna" name="comuna">
                            <option value="">-- Seleccione la comuna --</option>
                            <option value="linares">Linares</option>
                            <option value="longavi">Longaví</option>
                            <option value="concepcion">Concepción</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-register">REGISTRAR</button>
                
            </form>
        </div>
    </main> 
</body>
</html>
