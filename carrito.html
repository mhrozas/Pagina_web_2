<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de compras - Ch.Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="site-wrapper">

        <header class="header">
            <div class="logo">■ Ch.Store</div>
            <nav class="nav-links">
                <a href="index.html">Home</a> |
                <a href="productos.html">Productos</a> |
                <a href="nosotros.html">Nosotros</a> |
                <a href="blogs.html">Blogs</a> |
                <a href="contacto.html">Contacto</a>
            </nav>
            <a href="carrito.html" class="cart">🛒 Cart (0)</a>
        </header>

        <main class="cart-page">
            <nav class="breadcrumbs" aria-label="Ruta de navegación">
                <a href="index.html">Home</a> &gt; <span>Carrito</span>
            </nav>

            <h2>Mi carrito de compras</h2>

            <div class="cart-layout">

                <div class="cart-items-section">
                    <!-- Los productos del carrito se renderizan desde js/carrito.js -->
                </div>

                <div class="cart-summary-box">
                    <div class="summary-row">
                        <span class="summary-label">Subtotal:</span>
                        <span class="summary-subtotal">$ 0</span>
                    </div>
                    <div class="summary-row summary-row-descuento" id="fila-descuento">
                        <span class="summary-label">Descuento:</span>
                        <span class="summary-descuento">- $ 0</span>
                    </div>
                    <div class="summary-row summary-row-total">
                        <span class="summary-label">TOTAL:</span>
                        <span class="summary-total">$ 0</span>
                    </div>

                    <div class="coupon-section">
                        <label for="cupon">Ingrese el cupón de descuento</label>
                        <div class="coupon-input-group">
                            <input type="text" id="cupon" placeholder="CÓDIGO" maxlength="20">
                            <button class="btn-apply" id="btn-aplicar-cupon">APLICAR</button>
                        </div>
                        <span class="mensaje-error" id="error-cupon"></span>
                    </div>

                    <button class="btn-pay" id="btn-pagar">PAGAR</button>
                    <button class="btn-vaciar" id="btn-vaciar">VACIAR CARRITO</button>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-left">
                <span class="footer-logo">Ch.Store</span>
                <a href="productos.html">Productos</a> |
                <a href="contacto.html">Contacto</a>
            </div>
        </footer>

    </div>

    <script src="js/productos.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
