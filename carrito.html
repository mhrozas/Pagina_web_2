<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Ch.Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="site-wrapper">
        <div class="container-limits">
            
            <!-- HEADER -->
            <header class="header">
                <div class="logo">
                    <a href="index.html">
                        <img src="img/logo3.png" alt="Logo Ch.Store" class="header-logo">
                    </a>
                </div>
                <nav class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="index.html">Productos</a>
                    <a href="nosotros.html">Nosotros</a>
                    <a href="blogs.html">Blogs</a>
                    <a href="contacto.html">Contacto</a>
                </nav>
                <a href="carrito.html" class="cart-button">
                    <svg class="cart-icon-svg" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span>Carrito</span>
                    <span class="cart-badge" id="cart-counter">1</span>
                </a>
            </header>

            <!-- CONTENIDO DEL CARRITO -->
            <main class="cart-container">
                <h1 class="cart-title">Mi carrito de compras</h1>
                
                <div class="cart-layout">
                    <!-- Columna Izquierda: Lista de Productos -->
                    <div class="cart-items">
                        
                        <!-- Producto de ejemplo en el carrito -->
                        <div class="cart-item" id="fila-producto">
                            <img src="https://froens.cl/cdn/shop/files/VESTIDOTROPICNEGRO_2.webp" alt="Vestido Largo Negro">
                            <div class="cart-item-details">
                                <h3>Vestido Largo Negro</h3>
                                <p class="item-size">Talla: L</p>
                                <button class="btn-remove" onclick="eliminarProducto()">Eliminar</button>
                            </div>
                            <div class="cart-item-quantity">
                                <input type="number" id="cantidad-producto" value="1" min="1" onchange="actualizarTotal()">
                            </div>
                            <div class="cart-item-price">
                                $20.00
                            </div>
                        </div>
                        
                    </div>

                    <!-- Columna Derecha: Resumen de Compra -->
                    <div class="cart-summary">
                        <h2>Resumen del pedido</h2>
                        
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span id="subtotal-precio">$20.00</span>
                        </div>
                        <div class="summary-row">
                            <span>Envío</span>
                            <span>Por calcular</span>
                        </div>
                        <div class="summary-row total-row">
                            <span>TOTAL</span>
                            <span id="total-precio">$20.00</span>
                        </div>

                        <!-- Sección de Cupón -->
                        <div class="coupon-section">
                            <label for="codigo-descuento">Ingrese el cupón de descuento</label>
                            <div class="coupon-input-group">
                                <input type="text" id="codigo-descuento" placeholder="CÓDIGO">
                                <button class="btn-apply" onclick="aplicarDescuento()">Aplicar</button>
                            </div>
                        </div>

                        <button class="btn-checkout" onclick="procesarCompra()">PAGAR</button>
                    </div>
                </div>
            </main>

            <!-- FOOTER -->
            <footer class="footer">
                <div class="footer-left">
                    <span class="footer-logo">Ch.Store</span>
                    <a href="#">Términos</a> | <a href="#">Privacidad</a>
                    
                </div>
                <div class="footer-right">
                    <p>¡Únete a nuestro Newsletter!</p>
                    <form class="newsletter-form">
                        <input type="email" placeholder="Tu correo electrónico" required>
                        <button type="submit">Suscribir</button>
                    </form>
                </div>
            </footer>

        </div>
    </div>

    <!-- SCRIPT DE FUNCIONALIDAD DEL CARRITO -->
    <script>
        const precioUnitario = 20.00;
        let porcentajeDescuento = 0;

        // Calcula subtotal y total según cantidad y cupón activo
        function actualizarTotal() {
            const inputCantidad = document.getElementById('cantidad-producto');
            let cantidad = parseInt(inputCantidad.value);

            if (cantidad < 1 || isNaN(cantidad)) {
                cantidad = 1;
                inputCantidad.value = 1;
            }

            const subtotal = precioUnitario * cantidad;
            const totalConDescuento = subtotal - (subtotal * porcentajeDescuento);

            document.getElementById('subtotal-precio').innerText = '$' + subtotal.toFixed(2);
            
            if (porcentajeDescuento > 0) {
                document.getElementById('total-precio').innerHTML = `<span style="text-decoration: line-through; color: #999; font-size: 14px; margin-right: 8px;">$${subtotal.toFixed(2)}</span>$${totalConDescuento.toFixed(2)}`;
            } else {
                document.getElementById('total-precio').innerText = '$' + totalConDescuento.toFixed(2);
            }
        }

        // Aplica el cupón ingresado por el usuario
        function aplicarDescuento() {
            const inputDescuento = document.getElementById('codigo-descuento');
            const codigo = inputDescuento.value.trim().toUpperCase();

            if (codigo === 'DESCUENTO20') {
                porcentajeDescuento = 0.20;
                alert('¡Código de 20% de descuento aplicado con éxito!');
            } else if (codigo === 'CHSTORE10') {
                porcentajeDescuento = 0.10;
                alert('¡Código de 10% de descuento aplicado con éxito!');
            } else if (codigo === '') {
                alert('Por favor, ingresa un código de descuento.');
                return;
            } else {
                porcentajeDescuento = 0;
                alert('Código inválido. Revisa el texto e intenta nuevamente.');
            }

            actualizarTotal();
        }

        // Procesa el pago, limpia la vista y genera un código de envío aleatorio
        function procesarCompra() {
            const fila = document.getElementById('fila-producto');
            
            if (fila.style.display === 'none') {
                alert('Tu carrito está vacío. Agrega productos para realizar una compra.');
                return;
            }

            // Generar código aleatorio de envío de 6 caracteres (Ej: CH-8A3X1Z)
            const caracteres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let codigoEnvio = 'CH-';
            for (let i = 0; i < 6; i++) {
                codigoEnvio += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
            }

            alert(`¡Compra realizada con éxito!\\n\\nTu número de seguimiento de envío es: ${codigoEnvio}`);

            // Limpiar el producto visualmente y reiniciar valores
            eliminarProducto();
            document.getElementById('codigo-descuento').value = '';
            porcentajeDescuento = 0;
        }

        // Elimina el producto visualmente y resetea contadores
        function eliminarProducto() {
            document.getElementById('fila-producto').style.display = 'none';
            document.getElementById('subtotal-precio').innerText = '$0.00';
            document.getElementById('total-precio').innerText = '$0.00';
            document.getElementById('cart-counter').innerText = '0';
        }
    </script>
</body>
</html>
