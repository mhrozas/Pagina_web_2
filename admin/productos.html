<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Panel de administración</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

    <div class="admin-layout">

        <aside class="admin-sidebar">
            <div class="admin-logo">■ Ch.Store</div>
            <p class="admin-subtitulo">Panel de administración</p>

            <nav class="admin-menu" id="admin-menu">
                <a href="index.html" data-permiso="inicio">Inicio</a>
                <a href="productos.html" class="activo" data-permiso="productos">Productos</a>
                <a href="usuarios.html" data-permiso="usuarios">Usuarios</a>
                <a href="ordenes.html" data-permiso="ordenes">Órdenes</a>
            </nav>

            <div class="admin-sidebar-pie">
                <label for="selector-rol">Perfil activo</label>
                <select id="selector-rol">
                    <option value="Administrador">Administrador</option>
                    <option value="Vendedor">Vendedor</option>
                </select>
                <a href="../index.html" class="admin-salir">← Volver a la tienda</a>
            </div>
        </aside>

        <main class="admin-contenido">

            <header class="admin-header">
                <h1>Mantenedor de productos</h1>
                <a href="producto-form.html" class="btn-primary" data-permiso="crear">+ Nuevo producto</a>
            </header>

            <section class="admin-panel">
                <div class="admin-barra-busqueda">
                    <input type="text" id="buscar-producto" placeholder="Buscar por código o nombre...">
                    <select id="filtro-categoria-admin">
                        <option value="todas">Todas las categorías</option>
                    </select>
                </div>

                <table class="admin-tabla">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-productos">
                        <!-- Se llena desde js/admin.js -->
                    </tbody>
                </table>
            </section>

        </main>
    </div>

    <script src="../js/productos.js"></script>
    <script src="../js/regiones.js"></script>
    <script src="../js/validaciones.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
