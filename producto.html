<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del producto - Ch.Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="site-wrapper">

        <header class="header">
            <div class="logo">■ Ch.Store</div>
            <nav class="nav-links">
                <a href="index.html">Home</a> |
                <a href="productos.html">Productos</a> |
                <a href="nosotros.html">Nosotros</a> |
                <a href="blogs.html">Blogs</a> |
                <a href="contacto.html">Contacto</a>
            </nav>
            <a href="carrito.html" class="cart">🛒 Cart (0)</a>
        </header>

        <main class="product-page">

            <nav class="breadcrumbs" aria-label="Ruta de navegación">
                <a href="index.html">Home</a> &gt;
                <a href="productos.html">Productos</a> &gt;
                <span id="breadcrumb-producto">Producto</span>
            </nav>

            <div class="product-main">

                <div class="product-gallery">
                    <div class="main-image">
                        <img id="imagen-principal" src="" alt="Imagen del producto">
                    </div>
                    <div class="thumbnails" id="miniaturas">
                        <!-- Las miniaturas se cargan desde js/app.js -->
                    </div>
                </div>

                <div class="product-info-detail">
                    <div class="product-title-price">
                        <h1 id="producto-nombre">Producto</h1>
                        <span class="price" id="producto-precio">$0</span>
                    </div>

                    <p class="producto-codigo">Código: <span id="producto-codigo">—</span></p>
                    <p class="producto-categoria" id="producto-categoria"></p>

                    <p class="description" id="producto-descripcion"></p>

                    <p class="producto-stock" id="producto-stock"></p>

                    <div class="add-to-cart-section">
                        <label for="cantidad">Cantidad</label>
                        <select id="cantidad" name="cantidad">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select>
                    </div>

                    <button class="btn-add-cart" id="btn-add-cart">Añadir al carrito</button>
                    <span class="mensaje-exito" id="exito-carrito"></span>
                </div>
            </div>

            <div class="related-products">
                <h3>Productos relacionados</h3>
                <div class="products-grid" id="grid-relacionados">
                    <!-- Los relacionados se cargan desde js/app.js -->
                </div>
            </div>

        </main>

        <footer class="footer">
            <div class="footer-left">
                <span class="footer-logo">Ch.Store</span>
                <a href="productos.html">Productos</a> |
                <a href="nosotros.html">Nosotros</a> |
                <a href="contacto.html">Contacto</a>
            </div>
        </footer>

    </div>

    <script src="js/productos.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
