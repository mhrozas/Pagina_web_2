<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto - Ch.Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="site-wrapper">
        <div class="container-limits">

            <header class="header">
                <div class="logo">
                    <a href="index.html">
                        <img src="img/logo-chstore.png" alt="Ch.Store - Volver al inicio" class="header-logo">
                    </a>
                </div>
                <nav class="nav-links">
                    <a href="index.html">Home</a> |
                    <a href="productos.html" class="activo">Productos</a> |
                    <a href="nosotros.html">Nosotros</a> |
                    <a href="blogs.html">Blogs</a> |
                    <a href="contacto.html">Contacto</a>
                </nav>
                <a href="carrito.html" class="cart-button">
                    <svg class="cart-icon-svg" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span>Carrito</span>
                    <span class="cart-badge" id="cart-counter">0</span>
                </a>
            </header>

            <div class="auth-links" id="auth-links">
                <a href="login.html">Iniciar sesión</a> | <a href="registro.html">Registrar usuario</a> | <a href="admin/index.html">Administración</a>
            </div>

            <div class="breadcrumb">
                <a href="index.html">Home</a> &gt; <a href="productos.html">Productos</a> &gt; <span id="breadcrumb-producto"></span>
            </div>

            <!-- CONTENEDOR PRINCIPAL DEL PRODUCTO -->
            <main class="product-detail-container">

                <!-- Columna izquierda: imagen principal y miniaturas -->
                <div class="product-image-section">
                    <img id="imagen-principal" src="" alt="">
                    <div class="product-thumbnails" id="miniaturas"></div>
                </div>

                <!-- Columna derecha: información y compra -->
                <div class="product-info-section">
                    <h1 class="product-title-large" id="producto-nombre"></h1>
                    <p class="product-price-large" id="producto-precio"></p>
                    <p class="producto-codigo" id="producto-codigo"></p>
                    <p class="producto-categoria" id="producto-categoria"></p>

                    <p class="product-description" id="producto-descripcion"></p>

                    <p class="producto-stock" id="producto-stock"></p>

                    <div class="product-options">
                        <label for="talla">Talla:</label>
                        <select id="talla" name="talla">
                            <option value="">Selecciona una talla</option>
                        </select>
                        <span class="mensaje-error" id="error-talla"></span>
                    </div>

                    <div class="product-options">
                        <label for="cantidad">Cantidad:</label>
                        <select id="cantidad" name="cantidad"></select>
                    </div>

                    <button class="btn-add-cart" id="btn-add-cart">Añadir al carrito</button>
                    <div class="mensaje-exito" id="exito-carrito"></div>
                </div>
            </main>

            <section class="producto-relacionados">
                <h2 class="section-title">TAMBIÉN TE PUEDE GUSTAR</h2>
                <div class="products-grid" id="grid-relacionados"></div>
            </section>

            <footer class="footer">
                <div class="footer-left">
                    <span class="footer-logo">Ch.Store</span>
                    <a href="productos.html?categoria=Vestidos">Vestidos</a> |
                    <a href="productos.html?categoria=Blusas">Blusas</a> |
                    <a href="productos.html?categoria=Conjuntos">Conjuntos</a> |
                    <a href="productos.html?categoria=Pantalones">Pantalones</a>
                    <div class="payment-icons">
                        <span>💳 VISA</span> <span>💳 MC</span>
                    </div>
                </div>
                <div class="footer-right">
                    <p>¡Únete a nuestro Newsletter!</p>
                    <form class="newsletter-form" id="form-newsletter" novalidate>
                        <input type="email" id="newsletter-correo" placeholder="Tu correo electrónico" maxlength="100" aria-label="Correo para el newsletter">
                        <button type="submit">Suscribirse</button>
                    </form>
                    <span class="mensaje-error" id="error-newsletter"></span>
                </div>
            </footer>

        </div>
    </div>

    <script src="js/productos.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
