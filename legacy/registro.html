<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Ch.Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="registration-container">

        <!-- LOGO CLICKABLE QUE REDIRIGE AL INICIO -->
        <div class="logo-registro">
            <a href="index.html">
                <img src="img/logo-chstore.png" alt="Logo Ch.Store - Volver al inicio">
            </a>
        </div>

        <div class="form-box">
            <h2>Registro de usuario</h2>

            <form id="form-registro" novalidate>

                <div class="form-group">
                    <label for="run">RUN <span class="obligatorio">*</span></label>
                    <input type="text" id="run" name="run" maxlength="9" placeholder="Ej: 19011029K">
                    <span class="ayuda-campo">Sin puntos ni guion, entre 7 y 9 caracteres.</span>
                    <span class="mensaje-error" id="error-run"></span>
                </div>
                <div class="form-group">
                    <label for="nombre">NOMBRE <span class="obligatorio">*</span></label>
                    <input type="text" id="nombre" name="nombre" maxlength="50">
                    <span class="mensaje-error" id="error-nombre"></span>
                </div>
                <div class="form-group">
                    <label for="apellidos">APELLIDOS <span class="obligatorio">*</span></label>
                    <input type="text" id="apellidos" name="apellidos" maxlength="100">
                    <span class="mensaje-error" id="error-apellidos"></span>
                </div>
                <div class="form-group">
                    <label for="correo">CORREO <span class="obligatorio">*</span></label>
                    <input type="email" id="correo" name="correo" maxlength="100">
                    <span class="ayuda-campo">Solo @duoc.cl, @profesor.duoc.cl y @gmail.com.</span>
                    <span class="mensaje-error" id="error-correo"></span>
                </div>
                <div class="form-group">
                    <label for="password">CONTRASEÑA <span class="obligatorio">*</span></label>
                    <input type="password" id="password" name="password" maxlength="10">
                    <span class="ayuda-campo">Entre 4 y 10 caracteres.</span>
                    <span class="mensaje-error" id="error-password"></span>
                </div>
                <div class="form-group">
                    <label for="confirm_password">CONFIRMAR CONTRASEÑA <span class="obligatorio">*</span></label>
                    <input type="password" id="confirm_password" name="confirm_password" maxlength="10">
                    <span class="mensaje-error" id="error-confirm_password"></span>
                </div>
                <div class="form-group">
                    <label for="telefono">TELÉFONO (opcional)</label>
                    <input type="tel" id="telefono" name="telefono" maxlength="15">
                    <span class="mensaje-error" id="error-telefono"></span>
                </div>

                <div class="form-row">
                    <div class="form-group half-width">
                        <label for="region">REGIÓN <span class="obligatorio">*</span></label>
                        <select id="region" name="region">
                            <option value="">-- Seleccione la región --</option>
                        </select>
                        <span class="mensaje-error" id="error-region"></span>
                    </div>
                    <div class="form-group half-width">
                        <label for="comuna">COMUNA <span class="obligatorio">*</span></label>
                        <select id="comuna" name="comuna" disabled>
                            <option value="">-- Seleccione la comuna --</option>
                        </select>
                        <span class="mensaje-error" id="error-comuna"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="direccion">DIRECCIÓN <span class="obligatorio">*</span></label>
                    <input type="text" id="direccion" name="direccion" maxlength="300">
                    <span class="mensaje-error" id="error-direccion"></span>
                </div>

                <button type="submit" class="btn-register">REGISTRAR</button>

                <p class="form-pie">¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            </form>

            <div class="mensaje-exito" id="exito-registro"></div>
        </div>

    </main>

    <script src="js/productos.js"></script>
    <script src="js/regiones.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
